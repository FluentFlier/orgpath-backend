services:
  api:
    build: .
    container_name: orgpath-api
    ports:
      - "8080:8080"
      - "3000:3000"  # <--- ADD THIS LINE!
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://orgpath:orgpath@db:5432/orgpath
      - JWT_SECRET=change-this-secret
      - ALLOWED_ORIGIN=http://localhost:3000
    
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  db:
    image: postgres:15
    container_name: orgpath-db
    restart: always
    environment:
      POSTGRES_USER: orgpath
      POSTGRES_PASSWORD: orgpath
      POSTGRES_DB: orgpath
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: